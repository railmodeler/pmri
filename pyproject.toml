[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "pmri"
version = "0.1.2"
description = "PMRI -- Python Model Railroad Interface. Full base install: launcher + web service + shared infrastructure, bundled as one wheel."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
authors = [{name = "J Petrovick", email = "jpetrovick@gmail.com"}]
keywords = ["model-railroad", "dcc", "jmri", "nce", "loconet", "dcc-ex", "openlcb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
# All runtime dependencies for the base pmri stack, aggregated from
# the 10 sub-packages that used to be published separately. The
# pmri wheel contains their code directly (see
# tool.hatch.build.targets.wheel below); cross-package pmri-* pins
# are not needed because every module ships inside this one wheel.
# Command-station DRIVERS (pmri-nce, pmri-dccex, pmri-lenz,
# pmri-mrc, pmri-digitrax) are plugins installed separately -- they
# declare pmri as THEIR dependency, not the reverse.
dependencies = [
    "bcrypt>=4.1",
    "customtkinter>=5.2",
    "fastapi>=0.110",
    "itsdangerous>=2.1",
    "jinja2>=3.1",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "uvicorn[standard]>=0.27",
]

# Operators type "pmri" to launch; pip generates the per-OS wrapper
# (pmri.exe on Windows, pmri on POSIX) pointing at pmri_pmri.cli:main.
[project.scripts]
pmri = "pmri_pmri.cli:main"

# Driver entry points shipped IN THIS wheel. Hardware drivers in
# separate repos (pmri-nce, pmri-dccex, ...) register their own
# entries at install time via their own wheels' metadata.
[project.entry-points."pmri.connection"]
internal = "pmri_core.hal.internal:InternalConnection"
loconet = "pmri_loconet:LocoNetConnection"
openlcb = "pmri_openlcb:OlcbConnection"

[project.urls]
Homepage = "https://github.com/railmodeler/pmri"
Issues = "https://github.com/railmodeler/pmri/issues"
Source = "https://github.com/railmodeler/pmri"

# Bundle 10 source trees into one wheel. Each was its own package in
# the beta days; the one-PyPI-project constraint collapsed them.
# Import names stay the same (pmri_core, pmri_pmri, pmri_web, etc.)
# -- only the PyPI project count changed.
[tool.hatch.build.targets.wheel]
packages = [
    "src/pmri",
    "pmri-core/src/pmri_core",
    "pmri-decoderpro/src/pmri_decoderpro",
    "pmri-loconet/src/pmri_loconet",
    "pmri-logixng/src/pmri_logixng",
    "pmri-openlcb/src/pmri_openlcb",
    "pmri-pmri/src/pmri_pmri",
    "pmri-scripting/src/pmri_scripting",
    "pmri-server/src/pmri_server",
    "pmri-web/src/pmri_web",
    "pmri-withrottle/src/pmri_withrottle",
]
