[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "pmri"
version = "0.1.0"
description = "PMRI -- Python Model Railroad Interface. Meta-package that installs the full PMRI stack (launcher + web service + hardware drivers)."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
authors = [{name = "J Petrovick", email = "jpetrovick@gmail.com"}]
keywords = ["model-railroad", "dcc", "jmri", "nce", "loconet", "dcc-ex", "openlcb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
# Pinned to this release across the entire sibling set. A "pip install
# pmri==0.1.0" installs a known-tested set of wheels. pmri-ncemonitor
# has been merged into pmri-nce (one wheel, two entry points) to keep
# the PyPI project count aligned with the per-repo OIDC constraint.
# Command-station drivers (pmri-nce, pmri-dccex) live here as
# dependencies; stub packages (pmri-lenz, pmri-mrc, pmri-digitrax)
# are NOT pulled in by the meta-package until their drivers are real.
# Operators needing those install them explicitly ("pip install
# pmri-digitrax").
dependencies = [
    "pmri-core==0.1.0",
    "pmri-dccex==0.1.0",
    "pmri-decoderpro==0.1.0",
    "pmri-loconet==0.1.0",
    "pmri-logixng==0.1.0",
    "pmri-nce==0.1.0",
    "pmri-openlcb==0.1.0",
    "pmri-pmri==0.1.0",
    "pmri-scripting==0.1.0",
    "pmri-server==0.1.0",
    "pmri-web==0.1.0",
    "pmri-withrottle==0.1.0",
]

[project.urls]
Homepage = "https://github.com/railmodeler/pmri"
Issues = "https://github.com/railmodeler/pmri/issues"
Source = "https://github.com/railmodeler/pmri"

# The meta-package ships a tiny src/pmri/__init__.py whose only role is
# to make the wheel valid (hatchling requires at least one package to
# build) and to carry a __version__ string. Operators don't "import
# pmri" directly -- they run the `pmri` console_scripts wrapper that
# pmri-pmri provides as a transitive dependency.
[tool.hatch.build.targets.wheel]
packages = ["src/pmri"]
