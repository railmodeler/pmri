[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "jmri-pmri"
version = "0.1.0b39"
description = "PMRI launcher -- unified entry point for the Python Model Railroad Interface web service."
requires-python = ">=3.12"
dependencies = [
    "jmri-core==0.1.0b39",
    "jmri-server==0.1.0b39",
    # jmri-web mounts the HTML UI onto jmri-server's JSON API. The
    # launcher's uvicorn target is ``jmri_web:create_app`` so the
    # operator-visible root ``/`` serves pages, not ``{"detail":
    # "Not Found"}``.
    "jmri-web==0.1.0b39",
    "uvicorn[standard]>=0.27",
    "customtkinter>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
# Installs ``pmri`` on PATH -- the single launch point replacing JMRI's
# PanelPro / DecoderPro split per the launcher spec.
pmri = "jmri_pmri.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jmri_pmri"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --cov=jmri_pmri --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = ["PLR0913"]  # too-many-arguments -- customtkinter widgets are verbose

[tool.coverage.run]
# gui.py and the Tk-based picker dialog can't run without a real
# display; the launcher's headless main loop (``_run_headless``)
# and GUI dispatch (``run_gui``) exercise them in integration /
# manual smoke only. Omit from the auto-coverage gate so the
# measured percent reflects the testable surface.
omit = [
    "src/jmri_pmri/gui.py",
    "src/jmri_pmri/__main__.py",
]

[tool.coverage.report]
# cli._run_headless uses signal handlers + a long-running park which
# we exercise manually, not under pytest. Picker's Tk-dialog branch
# and the GUI's first-launch dialog also need a display. Combined,
# the testable floor is ~65%; the rest is covered by hand on-device.
fail_under = 65
