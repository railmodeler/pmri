[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "pmri-nce"
version = "0.1.0"
description = "NCE driver for the JMRI Python rewrite (Stage 4 â€” second driver, sync/poll model)."
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
dependencies = [
    "pmri-core==0.1.0",
    "pyserial-asyncio>=0.6",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
]

# Registers our driver with the core's plugin machinery.
# After `pip install`, pmri_core.plugins.load_connections() reports
# {'internal': ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¦, 'loconet': ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¦, 'nce': NceConnection}.
[project.entry-points."pmri.connection"]
nce = "pmri_nce:NceConnection"

[tool.hatch.build.targets.wheel]
packages = ["src/pmri_nce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "hardware: requires physical DCC hardware; skipped by default (pass --run-hardware to include)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["serial_asyncio.*", "serial.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PL", "PERF"]
ignore = [
    "PLR0913",   # too-many-args
    "PLR2004",   # magic values: NCE memory base addresses are inline
    "PLR0911",   # too-many-returns: command dispatchers
    "PLR0912",   # too-many-branches
]

[tool.coverage.run]
source = ["pmri_nce"]
branch = true
# The serial transport is hardware-only â€” covered by manual hardware smoke
# tests gated behind the `hardware` pytest marker, not by the loopback suite.
omit = ["*/transport/serial_port.py"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
