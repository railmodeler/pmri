[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "pmri-scripting"
version = "0.1.1"
description = "Scripting host for the JMRI Python rewrite (Stage 9)."
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
dependencies = [
    "pmri-core==0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0", "pytest-cov>=5.0,<7.0", "mypy>=1.10,<2.0", "ruff>=0.5,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/pmri_scripting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "hardware: requires physical DCC hardware; skipped by default (pass --run-hardware to include)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PL", "PERF"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912"]

[tool.coverage.run]
source = ["pmri_scripting"]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
