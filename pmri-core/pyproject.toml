[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "pmri-core"
version = "0.1.1"
description = "JMRI domain model, manager/registry, event bus, and HAL â€” Python rewrite Stage 1."
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
authors = [{ name = "JMRI Python rewrite" }]
dependencies = [
    "pydantic>=2.7",
    "lxml>=5.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
    "lxml-stubs>=0.5,<1.0",
]

[project.entry-points."pmri.connection"]
internal = "pmri_core.hal.internal:InternalConnection"

[tool.hatch.build.targets.wheel]
packages = ["src/pmri_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "hardware: requires physical DCC hardware; skipped by default (pass --run-hardware to include)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PL", "PERF"]
ignore = ["PLR0913"]  # too-many-arguments â€” fine for bean constructors

[tool.coverage.run]
source = ["pmri_core"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
