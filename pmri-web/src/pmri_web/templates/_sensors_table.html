<table id="sensors-table">
  <thead>
    <tr><th>System name</th><th>User name</th><th>State</th><th>Simulate</th></tr>
  </thead>
  <tbody>
    {% for s in sensors %}{% include "_sensor_row.html" %}{% endfor %}
    {% if not sensors %}
      <tr><td colspan="4" class="muted">No sensors yet — create one above.</td></tr>
    {% endif %}
  </tbody>
</table>
<script>
(function () {
  if (!window.jmriBus || window.__sensorPushWired) return;
  window.__sensorPushWired = true;
  window.jmriBus.on("sensor", (msg) => {
    const name = msg.data.name;
    const row = document.querySelector(`tr[data-sensor="${name}"]`);
    if (!row) return;
    const stateCell = row.querySelector(".state-cell");
    if (!stateCell) return;
    const s = msg.data.state;
    const cls = s === 2 ? "ok" : (s === 4 ? "" : "");
    const label = s === 2 ? "ACTIVE" : (s === 4 ? "INACTIVE" : (s === 8 ? "INCONSISTENT" : "UNKNOWN"));
    stateCell.innerHTML = `<span class="badge ${cls}">${label}</span>`;
  });
})();
</script>
