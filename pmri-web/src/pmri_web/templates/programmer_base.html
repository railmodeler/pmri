<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>{% block title %}Programmer{% endblock %} — jmri-web</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/static/style.css?v={{ static_v }}" />
<script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
<script src="/static/app.js?v={{ static_v }}" defer></script>
</head>
<body class="programmer-page">
<header class="programmer-header">
  <a href="/roster" class="return-link">&larr; Return to Roster</a>
  <span style="margin-left:auto" class="muted mono">{{ railroad }} · {{ jmri_version }}</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
