{% extends "base.html" %}
{% block title %}Lights{% endblock %}
{% block content %}
<h2>Lights</h2>

<div class="card">
  <form hx-post="/lights/create" hx-target="#lights-table" hx-swap="outerHTML" class="row">
    <label>Add by system name
      <input type="text" name="name" required pattern="[A-Z][A-Z0-9]*L[0-9]+"
             placeholder="IL1" title="Example: IL1 (internal light 1)" />
    </label>
    <button type="submit">Create</button>
  </form>
</div>

<div class="card">
  {% include "_lights_table.html" %}
</div>
{% endblock %}
