<h3>Fast Clock</h3>

<div class="row" style="align-items:flex-start;gap:2rem;flex-wrap:wrap">
  <!-- LEFT: live display + Start/Stop -->
  <div class="col" style="flex:1;min-width:280px">
    <div class="row" style="align-items:center;gap:1rem">
      <div class="col">
        <span class="muted" style="font-size:0.85em">Fast time</span><br/>
        <span id="fc-display" class="mono"
              style="font-size:2.2em;font-weight:bold">{{ fast_clock.time }}</span>
      </div>
      <div class="col">
        <span class="muted" style="font-size:0.85em">Rate</span><br/>
        <span id="fc-rate-display" class="mono"
              style="font-size:1.4em">{{ fast_clock.rate }}× real</span>
      </div>
      <div class="col">
        <span class="muted" style="font-size:0.85em">State</span><br/>
        <span class="badge {% if fast_clock.running %}ok{% else %}warn{% endif %}"
              id="fc-running-badge">
          {% if fast_clock.running %}RUNNING{% else %}STOPPED{% endif %}
        </span>
      </div>
    </div>
    <div class="row" style="margin-top:0.75rem;align-items:center;gap:0.5rem">
      <button type="button" class="ok" onclick="fcRun(true)">Start</button>
      <button type="button" class="danger" onclick="fcRun(false)">Stop</button>
      <label style="display:inline-flex;align-items:center;gap:0.25rem;margin-left:0.75rem">
        <input id="fc-12h" type="checkbox" /> 12-hour
      </label>
    </div>
  </div>

  <!-- RIGHT: Set time / rate + Apply / Get -->
  <div class="col" style="flex:1;min-width:260px">
    <div class="row" style="align-items:flex-end;gap:0.75rem">
      <label>Set time
        <input id="fc-time" type="time" value="{{ fast_clock.time }}" />
      </label>
      <label>Set rate
        <input id="fc-rate" type="number" step="0.1" min="0.1" max="100"
               value="{{ fast_clock.rate }}" style="width:5em" />
      </label>
    </div>
    <div class="row" style="margin-top:0.75rem;gap:0.5rem">
      <button type="button" onclick="fcSet()">Apply</button>
      <button type="button" onclick="fcGet()"
              title="Refresh inputs + display from server">Get</button>
    </div>
  </div>
</div>

<script>
(function () {
  if (window.__fastClockWired) return;
  window.__fastClockWired = true;

  const display = document.getElementById("fc-display");
  const badge   = document.getElementById("fc-running-badge");
  const rateDsp = document.getElementById("fc-rate-display");
  const rateIn  = document.getElementById("fc-rate");
  const timeIn  = document.getElementById("fc-time");
  const fmt12   = document.getElementById("fc-12h");

  // Initialise 12h preference from localStorage.
  try {
    const saved = localStorage.getItem("fcFormat12");
    if (saved === "1") fmt12.checked = true;
  } catch (_) {}

  function format(t24) {
    // t24 is "HH:MM" 24-hour. Convert to "h:MM AM/PM" if requested.
    if (!fmt12.checked) return t24;
    const [hStr, m] = t24.split(":");
    let h = parseInt(hStr, 10);
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12; if (h === 0) h = 12;
    return `${h}:${m} ${ampm}`;
  }

  function updateDisplay(s) {
    // Read-only display + state only — does NOT overwrite the input
    // fields. The poll re-renders the clock face every second.
    display.textContent = format(s.time);
    rateDsp.textContent = s.rate + "× real";
    badge.className     = "badge " + (s.running ? "ok" : "warn");
    badge.textContent   = s.running ? "RUNNING" : "STOPPED";
  }

  function applyToInputs(s) {
    // Get button calls this — overwrites the input fields with the
    // server's current values.
    timeIn.value = s.time;
    rateIn.value = s.rate;
  }

  async function post(payload) {
    const r = await fetch("/json/", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({type:"time", method:"post", data: payload}),
    });
    if (r.ok) updateDisplay((await r.json()).data);
  }

  async function fetchState(populateInputs) {
    try {
      const r = await fetch("/json/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({type:"time", method:"get"}),
      });
      if (r.ok) {
        const s = (await r.json()).data;
        updateDisplay(s);
        if (populateInputs) applyToInputs(s);
      }
    } catch (_) { /* tolerate transient failures */ }
  }

  fmt12.addEventListener("change", () => {
    try { localStorage.setItem("fcFormat12", fmt12.checked ? "1" : "0"); } catch (_) {}
    fetchState(false);   // re-render the big display in the new format
  });

  window.fcSet = () => post({time: timeIn.value, rate: parseFloat(rateIn.value)});
  window.fcRun = (run) => post({running: run});
  window.fcGet = () => fetchState(true);   // Get explicitly populates inputs

  setInterval(() => fetchState(false), 1000);
})();
</script>
