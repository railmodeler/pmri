{% extends "base.html" %}
{% block title %}Cars — Operations Pro{% endblock %}
{% block content %}
<h2>Cars</h2>
<p><a href="/operations">&larr; Operations Pro</a></p>

<div class="card">
  <h3>Add a car</h3>
  <form hx-post="/operations/cars/create"
        hx-target="#operations-cars-table" hx-swap="outerHTML"
        class="row" style="gap:0.5rem; flex-wrap:wrap; align-items:baseline">
    <label>ID
      <input type="text" name="id" required pattern="[A-Za-z0-9_.:-]+"
             placeholder="car-1" style="width:8em" /></label>
    <label>Road
      <input type="text" name="roadName" placeholder="SP" style="width:6em" /></label>
    <label>Number
      <input type="text" name="roadNumber" placeholder="4449" style="width:7em" /></label>
    <label>Type
      <select name="type" style="width:10em">
        <option value="">(pick one)</option>
        {% for t, _in_roster in car_types_catalog %}
        <option value="{{ t }}">{{ t }}</option>
        {% endfor %}
      </select></label>
    <label>Length
      <input type="text" name="length" placeholder="40" style="width:5em" /></label>
    <label>Load
      <input type="text" name="load" placeholder="E" style="width:4em" /></label>
    <label>Location
      <select name="locationId" style="width:12em">
        <option value="">(none)</option>
        {% for l in locations %}
        <option value="{{ l.id }}">{{ l.name or l.id }}</option>
        {% endfor %}
      </select></label>
    <button type="submit">Add</button>
  </form>
</div>

<div class="card">
  {% include "_operations_cars_table.html" %}
</div>
{% endblock %}
