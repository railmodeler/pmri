{% extends "base.html" %}
{% block title %}Turnouts{% endblock %}
{% block content %}
<h2>Turnouts</h2>

<div class="card">
  <form hx-post="/turnouts/create" hx-target="#turnouts-table" hx-swap="outerHTML" class="row">
    <label>Add by system name
      <input type="text" name="name" required pattern="[A-Z][A-Z0-9]*T[0-9]+"
             placeholder="IT12" title="Example: IT12 (internal turnout 12)" />
    </label>
    <button type="submit">Create</button>
  </form>
</div>

<div class="card">
  {% include "_turnouts_table.html" %}
</div>
{% endblock %}
