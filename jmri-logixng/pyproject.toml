[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "jmri-logixng"
version = "0.1.0"
description = "LogixNG automation engine for the JMRI Python rewrite (Stage 7)."
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
dependencies = [
    "jmri-core==0.1.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    # lxml pulled in transitively via jmri-core but declared here
    # too so the JMRI XML importer's dependency is explicit.
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0", "pytest-cov>=5.0,<7.0", "mypy>=1.10,<2.0", "ruff>=0.5,<1.0", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/jmri_logixng"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "hardware: requires physical DCC hardware; skipped by default (pass --run-hardware to include)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PL", "PERF"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912"]

[tool.coverage.run]
source = ["jmri_logixng"]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
