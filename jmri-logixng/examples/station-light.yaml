# Example LogixNG automation:
# When the station block sensor goes active AND the platform turnout is closed,
# turn on the platform light. Otherwise turn it off.

type: logixng:root
user_name: Station platform light
enabled: true
conditionals:
  - type: logixng:conditional
    user_name: Platform light follows block occupancy
    enabled: true
    actions:
      - type: action:if-then-else
        condition:
          type: expr:and
          children:
            - type: expr:sensor-active
              sensor: IS1
            - type: expr:turnout-closed
              turnout: IT1
        then:
          type: action:set-light
          light: IL1
          state: ON
        else:
          type: action:set-light
          light: IL1
          state: OFF
