name: Upload PMRI base wheel to PyPI when a Release is Created

on:
  release:
    types: [created]

jobs:
  pypi-publish:
    name: Build and publish the pmri base wheel to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pmri
    permissions:
      # Trusted Publishing (OIDC). Only ONE PyPI project ships from
      # this repo -- `pmri`, the base wheel that bundles all ten
      # subpackage source trees in a single artefact. Command-station
      # drivers (pmri-nce, pmri-dccex, pmri-lenz, pmri-mrc,
      # pmri-digitrax) are published from their own repos with their
      # own trusted-publisher configs; they are NOT touched here.
      id-token: write
      contents: read

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build the pmri wheel + sdist
        run: |
          mkdir -p dist
          python -m build --outdir dist .
          echo "Built artefacts:"
          ls -la dist/

      - name: Publish the pmri distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
