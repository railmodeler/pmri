[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "jmri-server"
version = "0.1.0b39"
description = "JMRI JSON/WebSocket HTTP server â€” Python rewrite Stage 3."
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
dependencies = [
    "jmri-core==0.1.0b39",
    "jmri-scripting==0.1.0b39",
    "jmri-logixng==0.1.0b39",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.7",
    # Auth: bcrypt for password hashing, PyYAML for users.yaml,
    # itsdangerous for signed session cookies. All are optional
    # at runtime â€” the auth subsystem is only loaded when
    # JMRI_AUTH_ENABLED=1 â€” but pinning them in the base deps
    # keeps the beta wheel self-contained.
    "bcrypt>=4.1",
    "PyYAML>=6.0",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",       # FastAPI TestClient
    "websockets>=12,<15",
    "jsonschema>=4.20,<5.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jmri_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "hardware: requires physical DCC hardware; skipped by default (pass --run-hardware to include)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PL", "PERF"]
ignore = ["PLR0913"]

[tool.coverage.run]
source = ["jmri_server"]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
