<table id="turnouts-table">
  <thead>
    <tr><th>System name</th><th>User name</th><th>State</th><th>Actions</th></tr>
  </thead>
  <tbody>
    {% for t in turnouts %}{% include "_turnout_row.html" %}{% endfor %}
    {% if not turnouts %}
      <tr><td colspan="4" class="muted">No turnouts yet — create one above.</td></tr>
    {% endif %}
  </tbody>
</table>
<script>
// Wire WebSocket pushes to update individual rows.
(function () {
  if (!window.jmriBus || window.__turnoutPushWired) return;
  window.__turnoutPushWired = true;
  window.jmriBus.on("turnout", (msg) => {
    const name = msg.data.name;
    const row = document.querySelector(`tr[data-turnout="${name}"]`);
    if (!row) return;
    // Replace the state badge in-place. We rebuild it client-side rather
    // than re-fetching the whole row HTML.
    const stateCell = row.querySelector(".state-cell");
    if (!stateCell) return;
    const s = msg.data.state;
    const cls = s === 2 ? "ok" : (s === 4 ? "err" : "");
    const label = s === 2 ? "CLOSED" : (s === 4 ? "THROWN" : (s === 8 ? "INCONSISTENT" : "UNKNOWN"));
    stateCell.innerHTML = `<span class="badge ${cls}">${label}</span>`;
  });
})();
</script>
