{% set t = throttle %}
<div id="throttle-status" class="row">
  {% if t.get("released") %}
    <span class="badge warn">Released</span>
  {% else %}
    <div class="speed-display mono">
      {{ "%.0f" | format((t.speed or 0) * 100) }}
      / {% if t.forward %}FWD{% else %}REV{% endif %}
    </div>
    <span class="muted mono">Addr {{ t.address }}</span>
  {% endif %}
</div>
