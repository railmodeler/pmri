<table id="lights-table">
  <thead>
    <tr><th>System name</th><th>User name</th><th>State</th><th>Actions</th></tr>
  </thead>
  <tbody>
    {% for l in lights %}{% include "_light_row.html" %}{% endfor %}
    {% if not lights %}
      <tr><td colspan="4" class="muted">No lights yet — create one above.</td></tr>
    {% endif %}
  </tbody>
</table>
<script>
(function () {
  if (!window.jmriBus || window.__lightPushWired) return;
  window.__lightPushWired = true;
  window.jmriBus.on("light", (msg) => {
    const name = msg.data.name;
    const row = document.querySelector(`tr[data-light="${name}"]`);
    if (!row) return;
    const stateCell = row.querySelector(".state-cell");
    if (!stateCell) return;
    const s = msg.data.state;
    const cls = s === 4 ? "ok" : (s === 2 ? "" : "warn");
    const label = s === 2 ? "OFF" : (s === 4 ? "ON" : (s === 8 ? "DIM" : "UNKNOWN"));
    stateCell.innerHTML = `<span class="badge ${cls}">${label}</span>`;
  });
})();
</script>
